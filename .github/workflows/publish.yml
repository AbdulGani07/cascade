name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options: [latest, next, beta]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AbdulGani07/cascade' && github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false
      - name: Use an npm version with trusted-publishing support
        run: npm install --global npm@11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Validate distribution tag and release version
        id: release
        env:
          DIST_TAG: ${{ inputs.tag }}
        run: node scripts/validate-release.mjs --tag "$DIST_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Reject an existing release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::error::Git tag v${VERSION} already exists."
            exit 1
          fi
      - run: node scripts/validate-release.mjs --pack --output release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs-${{ github.sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-artifacts/*.tgz
      - name: Publish with npm trusted publishing and provenance
        run: pnpm changeset publish --tag "${{ inputs.tag }}"
      - name: Create repository release
        if: inputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --generate-notes --title "Cascade v${VERSION}"
