name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options: [latest, next, beta]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: npm-publish

jobs:
  publish:
    if: github.repository == 'AbdulGani07/cascade' && github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node scripts/validate-release.mjs --pack --output release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs-${{ github.sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-artifacts/*.tgz
      - name: Publish with npm trusted publishing and provenance
        run: pnpm changeset publish --tag "${{ inputs.tag }}"
      - name: Create repository release
        if: inputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --generate-notes --title "Cascade v${VERSION}"
